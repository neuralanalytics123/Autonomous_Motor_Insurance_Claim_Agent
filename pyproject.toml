[project]
name = "claimflow"
version = "6.1.0"
description = "Motor Vehicle Claims Studio with clean root app.py entry point for Streamlit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "pydantic",
    "pydantic-settings",
    "langgraph",
    "langchain-core",
    "qdrant-client",
    "fastembed",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "pandas",
    "openpyxl",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "app.py",
    "agents",
    "core",
    "data_loader",
    "db",
    "rag",
    "data",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
